# B5.2-45: subordinada adverbial - temporal - sempre que (+ conjuntivo)
b5d2_45:
  positive:
    - Podes contar com a minha ajuda sempre que precisares.
    - Visita-nos sempre que vieres a Lisboa.
    - Sempre que quiseres, podemos ir ao cinema.
    - Telefona-me sempre que houver algum problema.
    - Sempre que eles chegarem tarde, avisa-me.
