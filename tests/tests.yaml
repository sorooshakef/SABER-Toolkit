    - Ele é rico, mas infeliz.
    - Estudei muito, mas não passei.
    - Está sol, mas faz frio.
    - Quero sair, mas não posso.
  negative:
    - Vivo em Portugal e sou italiano.
    - Ele é rico e feliz.
    - Estudei muito e passei.
    - Está sol e faz calor.
    - Quero sair e posso.

# B5.1-4: coordenada conclusiva - então
b5d1_4:
  positive:
    - Estou doente, então não vou à aula.
    - Ele tem dinheiro, então comprou o carro.
    - Nós sabíamos a verdade, então não dissemos nada.
    - Ela está cansada, então vai dormir.
    - Tu queres sair, então vamos agora.
  negative:
    - Naquela altura, ainda não sabíamos a verdade.        # "então" ausente; sentido temporal
    - Então, o que é que vamos fazer agora?                # "então" como marcador discursivo/interjeição
    - Desde então, ela nunca mais foi à aula.              # "desde então" locução temporal
    - Ele estava doente, mas mesmo assim comprou o carro.  # conector adversativo, não conclusivo
    - Só então percebemos que a porta estava aberta.       # "então" advérbio de tempo

# B5.1-5: coordenada copulativa - nem
b5d1_5:
  positive:
    - Não comprei pão nem leite.
    - Ele não fala nem ouve.
    - Nós não vimo-lo nem a ela.
    - Ela não trabalha nem estuda.
    - Não sou rico nem pobre.
  negative:
    - Comprei pão e leite.
    - Ele fala e ouve.
    - Nós vimo-los.
    - Ela trabalha e estuda.
    - Sou rico e pobre.

# B5.1-6: coordenada conclusiva - logo, por isso
b5d1_6:
  positive:
    - João está doente, logo não vem.
    - A Rita tem pressa, por isso correu.
    - O céu está escuro, logo vai chover.
    - Fizemos o trabalho, por isso estamos cansados.
    - Ela ganhou o prémio, logo está feliz.
  negative:
    - Logo de manhã, o João foi ao médico.
    - Logo que a Rita chegou, foi descansar.
    - O João pediu desculpa por isso.
    - A Rita entrou e foi logo para a cama.
    - Não vale a pena chorar por isso.

# B5.1-7: coordenada explicativa - pois
b5d1_7:
  positive:
    - Estou cansado, pois deitei-me tarde.
    - Ele está feliz, pois ganhou a lotaria.
    - Ela chora, pois perdeu o cão.
    - Nós estudamos, pois temos exame.
    - Eles saíram, pois estava calor.
  negative:
    - Estou cansado porque deitei-me tarde.
    - Ele está feliz porque ganhou.
    - Ela chora porque perdeu.
    - Nós estudamos para o exame.
    - Eles saíram hoje.

# B5.1-8: coordenada copulativa - não só…mas também
b5d1_8:
  positive:
    - O João não só chegou atrasado como também não fez o trabalho.
    - Gosto tanto de ler como de ver televisão.
    - O João nem ligou nem deixou recado.
    - Ela não só canta mas também dança.
    - Eles tanto vieram como trouxeram presentes.
  negative:
    - O João chegou atrasado.
    - Gosto de ler.
    - O João não ligou.
    - Ela canta e dança.
    - Eles vieram cá.

# B5.1-9: coordenada disjuntiva - ou...ou; quer...quer
b5d1_9:
  positive:
    - Ou andas mais depressa ou vamos chegar atrasados.
    - Quer chova quer faça sol, iremos sair.
    - Ora estuda ora dorme.
    - Seja rico seja pobre, todos são iguais.
    - Ou comes tudo ou não tens sobremesa.
  negative:
    - Andas depressa ou chegamos atrasados.
    - Chove ou faz sol.
    - Ele estuda e dorme.
    - Rico ou pobre são iguais.
    - Comes tudo.

# B5.1-10: coordenada adversativa - porém, contudo
b5d1_10:
  positive:
    - O João está doente, porém veio trabalhar.
    - Estudei muito, contudo não passei.
    - Ela é simpática, no entanto é tímida.
    - Queremos viajar, ainda assim ficamos em casa.
    - O filme foi longo, porém interessante.
  negative:
    - Estudei muito e, por isso, passei no exame.          # conector conclusivo, não adversativo
    - Gosto de muitos filmes e também aprecio o terror.    # conector copulativo
    - Ele é rico, portanto vive sem preocupações.          # conector conclusivo
    - O dia está bonito porque o sol brilha.               # conector causal
    - Ela é inteligente, logo resolve tudo depressa.       # conector conclusivo

# B5.1-11: coordenada conclusiva - portanto, assim
b5d1_11:
  positive:
    - A Rita tem medo de alturas, portanto não voa.
    - O teste foi fácil, assim todos passaram.
    - Temos tempo, portanto vamos com calma.
    - Ele é inteligente, portanto resolveu o problema.
    - Está calor, assim vamos à praia.
  negative:
    - Faz o exercício assim, com calma.                    # "assim" advérbio de modo
    - Assim como tu, também eu gosto de viajar.            # "assim como" comparativo
    - Assim que chegámos, fomos à praia.                   # "assim que" temporal
    - Está calor, mas não vamos à praia.                   # conector adversativo, não conclusivo
    - Ele é inteligente e trabalhador.                     # conector copulativo

# B5.1-12: coordenada adversativa - todavia, não obstante
b5d1_12:
  positive:
    - Gosto de muitos filmes, todavia não aprecio terror.
    - Ele é rico. Não obstante, vive de forma simples.
    - Trabalhamos muito, todavia não terminámos.
    - Ela é inteligente, não obstante comete erros.
    - O dia está bonito, todavia faz frio.
  negative:
    - Trabalhamos muito e terminámos o projeto.            # conector copulativo
    - Ela é inteligente, por isso comete poucos erros.     # conector conclusivo
    - Gosto de muitos filmes porque me distraem.           # conector causal
    - O dia está bonito, então vamos passear.              # conector conclusivo
    - Ele é rico e vive de forma simples.                  # conector copulativo

# B5.1-13: coordenada conclusiva - por conseguinte
b5d1_13:
  positive:
    - Estudei pouco, por conseguinte não passei.
    - Ele é o chefe, por conseguinte ele manda.
    - O trânsito está parado, por conseguinte chegaremos tarde.
    - Ela é a melhor, por conseguinte ganhou.
    - Choveu muito, por conseguinte o rio transbordou.
  negative:
    - Estudei pouco, mas passei à mesma.                   # conector adversativo
    - Ele é o chefe e dá as ordens.                        # conector copulativo
    - O trânsito está parado porque houve um acidente.     # conector causal
    - Choveu muito, no entanto o rio não transbordou.      # conector adversativo
    - Ela ganhou o prémio e ficou muito feliz.             # conector copulativo

