    - Como estava a chover, ficámos em casa.
    - Como ele é simpático, todos gostam dele.
    - Como não tinhas chave, bateste à porta.
    - Como nós sabíamos a verdade, não dissemos nada.
  negative:
    - Ela corre tão depressa como o irmão.                 # "como" comparativo
    - Como é que resolveste o problema?                    # "como" interrogativo (modo)
    - Ao pequeno-almoço, como sempre pão com manteiga.     # "como" = 1.ª pessoa de "comer"
    - Faz o exercício como o professor explicou.           # "como" conformativo/modal
    - Trabalha numa empresa como programador.              # "como" = na qualidade de

