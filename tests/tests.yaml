    - Ele chega sempre atrasado ao trabalho.               # "sempre" advérbio, sem oração
    - Todas as vezes que o vi, cumprimentei-o.             # locução equivalente + INDICATIVO
    - Podes contar comigo para sempre.                     # "para sempre" locução

# B5.2-46: subordinada adverbial - temporal - (de) cada vez que, (de) todas as vezes que (+ conjuntivo)
b5d2_46:
  positive:
    - Todas as vezes que o vires, diz-lhe olá.                          # futuro do conjuntivo (ver)
    - De cada vez que ele vier, faremos um bolo.                        # futuro do conjuntivo (vir)
    - Cada vez que tu quiseres, eu ajudo-te.                            # futuro do conjuntivo (querer)
    - Prometeu que, cada vez que eu precisasse de ajuda, estaria lá.    # imperfeito do conjuntivo (backshift)
    - Disse que, todas as vezes que o visse, ficava mais tranquilo.     # imperfeito do conjuntivo (ver)
  negative:
    - Cada vez que visitei a loja, recebi um desconto.                  # certo lema, pretérito do INDICATIVO
    - Cada vez que eu precisava de ajuda, ele ajudava-me.               # certo lema, imperfeito do INDICATIVO
    - Sempre que precisares de ajuda, liga-me.                          # conjuntivo, mas gatilho temporal fora do alvo
    - Uma vez que estás cansado, deves descansar.                       # "vez que" na superfície, mas causal + indicativo
    - A cidade fica cada vez mais cara.                                 # "cada vez" sem que-oração (intensificador)

# B5.2-51: subordinada adverbial - condicional - a menos que, a não ser que (+ conjuntivo)
b5d2_51:
  positive:
    - Iremos ao jantar, a não ser que haja algum imprevisto.
    - Vou sair agora, a menos que queiras vir comigo.
    - Iremos à praia amanhã, a não ser que chova.
    - Ele não fará o trabalho, a menos que lhe paguem mais.
    - Não diremos nada a ninguém, a não ser que seja necessário.
  negative:
    - Não como nada a não ser fruta ao pequeno-almoço.     # "a não ser" + nome (exceção, sem oração)
    - Ninguém faltou à reunião, a não ser o diretor.       # "a não ser" + nome (exceção)
    - Iremos à praia amanhã se não chover.                 # condicional com "se", não "a menos/não ser que"
    - Ele trabalha menos que os colegas.                   # "menos que" comparativo
    - Vou sair agora porque quero apanhar o comboio.       # causal, sem estrutura condicional

# B5.2-53: subordinada adverbial - comparativa - como se
b5d2_53:
  positive:
    - Falámos como se nos conhecêssemos há muito tempo.
    - Ela corre como se fosse uma atleta profissional.
    - Ele olha para mim como se eu estivesse a mentir.
    - Tu ages como se nada tivesse acontecido.
    - Eles gritam como se estivessem loucos.
  negative:
    - Falámos e conhecemo-nos.
    - Ela é uma atleta.
    - Eu estou a mentir.
    - Nada aconteceu.
    - Eles estão loucos.

# B5.2-54: subordinada adverbial conformativa - consoante, conforme
b5d2_54:
  positive:
    - Faz conforme achares melhor.
    - Age consoante as circunstâncias indicarem.
    - Escreve o texto conforme o professor pediu.
    - Decidiremos consoante as propostas que recebermos.
    - Conforme fores crescendo, irás compreender melhor.
  negative:
    - Recebi o material conforme o combinado.              # "conforme" preposição + nome
    - O "s" é uma consoante da língua portuguesa.          # "consoante" = nome (fonética)
    - O relatório está conforme as normas em vigor.        # "conforme" adjetivo (em conformidade)
    - Faz o trabalho como o professor pediu.               # "como", não "conforme/consoante"
    - Age de acordo com as circunstâncias.                 # locução equivalente, sem "consoante/conforme"

# B5.2-56: subordinada substantiva completiva - flexionada - iniciada por que - com verbos em colocação com nomes
b5d2_56:
  positive:
    - Faz falta que os jovens se interessem mais pela política.
    - Dá pena que ele não tenha vindo.
    - Faz sentido que tudo seja esclarecido.
    - Dá jeito que vocês tragam o material para a reunião.
    - Faz confusão que eles não aceitem as novas regras.
  negative:
    - Faz falta estudar mais a matéria para o exame.
    - Dá pena vê-lo abandonar o projeto a meio.
    - Esta explicação finalmente faz sentido para mim.
    - Dá muito jeito trabalhar com dois monitores.
    - Toda esta situação me faz muita confusão.

# B5.2-58: subordinada substantiva completiva - flexionada - de infinitivo (pessoal) - infinitivo pessoal composto
b5d2_58:
  positive:
    - O Ivo reconheceu ter sido muito teimoso.
    - Os alunos lamentaram terem chegado atrasados.
    - Ela admitiu ter feito um erro.
    - Nós afirmamos termos dito a verdade.
    - Eles confessaram terem roubado o carro.
  negative:
    - O Ivo foi teimoso.
    - Os alunos chegaram atrasados.
    - Ela fez um erro.
    - Nós dissemos a verdade.
    - Eles roubaram o carro.

# B5.2-62: subordinada adverbial - causal - participial
b5d2_62:
  positive:
    - Lesionado, o atleta não participou na maratona.
    - Cansado, o rapaz adormeceu no sofá.
    - Assustada, a gata escondeu-se debaixo da cama.
    - Atrasados, os convidados perderam o início do espetáculo.
    - Confuso, o aluno pediu uma clarificação ao professor.
  negative:
    - Porque estava lesionado, o atleta não participou na maratona. # Finite causal clause
    - O atleta foi lesionado durante o jogo. # Passive voice
    - O homem cansado adormeceu no sofá. # Attributive participle/adjective modifier
    - Terminada a reunião, saíram todos contentes. # C2 (B2.1-232): Absolute participial clause
    - Aberta a porta, puderam entrar. # C2 (B2.1-232): Absolute participial clause

# B5.2-63: subordinada adverbial - causal - devido a, devido ao facto de (+ infinitivo)
b5d2_63:
  positive:
    - O livro foi um sucesso devido ao facto de ter recebido um prémio.
    - Ele está cansado devido a ter trabalhado muito.
    - O trânsito parou devido ao facto de ter havido um acidente.
    - Não fomos à praia devido a estar a chover.
    - Ela ficou feliz devido ao facto de ter visto a notícia.
  negative:
    - O livro foi um sucesso devido ao prémio recebido.    # "devido a" + nome, não oração de infinitivo
    - Não fomos à praia por causa da chuva.                # causa por locução + nome
    - O respeito devido aos mais velhos é importante.      # "devido" adjetivo (que se deve)
    - O trânsito parou porque houve um acidente.           # causal finita com "porque"
    - Ele está cansado, pois trabalhou muito.              # causal finita com "pois"

# B5.2-64: subordinada adverbial - causal - graças a, por culpa de (+ infinitivo)
b5d2_64:
  positive:
    - Ele tem dificuldade em respirar por culpa de fumar tanto.
    - Conseguimos chegar a tempo graças a termos apanhado o táxi.
    - Ela ficou doente por culpa de não se ter agasalhado.
    - Graças a termos estudado muito, passámos no exame.
    - Por culpa de terem saído tarde, perderam o comboio.
  negative:
    - Conseguimos chegar a tempo graças ao táxi.           # "graças a" + nome, não oração
    - Ela ficou doente por culpa do frio.                  # "por culpa de" + nome
    - Demos graças pela ajuda que recebemos.               # "graças" nome (agradecimento)
    - Passámos no exame porque estudámos muito.            # causal finita com "porque"
    - Ele tem dificuldade em respirar por fumar tanto.     # "por" + infinitivo, sem "culpa de/graças a"

# B5.2-65: subordinada adverbial - temporal - mal...(logo) (+ indicativo / conjuntivo)
b5d2_65:
  positive:
    - Mal entrei em casa, apercebi-me logo de que alguém lá tinha estado.
    - Mal chegues, telefona-me logo.
    - Mal ele viu a Maria, sorriu logo.
    - Mal soubermos a notícia, avisamos-te logo.
    - Mal eles partiram, começou logo a chover.
  negative:
    - Ele fala muito mal o português.                      # "mal" advérbio de modo (= badly)
    - O bem sempre vence o mal.                            # "mal" = nome
    - Sinto-me mal desde ontem à noite.                    # "mal" advérbio
    - Chegámos cedo, logo tivemos tempo de sobra.          # "logo" conclusivo, sem "mal" temporal
    - Entrei em casa e fui logo dormir.                    # "logo" advérbio de tempo, sem oração "mal"

# B5.2-66: subordinada adverbial - temporal - à medida que, ao passo que (+ indicativo / conjuntivo)
b5d2_66:
  positive:
    - À medida que a economia melhora, o desemprego diminui.
    - À medida que fores crescendo, irás compreender.
    - Ao passo que o tempo passa, ficamos mais velhos.
    - À medida que eles chegavam, íamos servindo o jantar.
    - Ao passo que uns trabalham, outros descansam.
  negative:
    - O fato foi feito à medida do cliente.                # "à medida de" + nome (sob medida)
    - O governo anunciou uma nova medida económica.        # "medida" = nome
    - Ele deu um passo em frente e parou.                  # "passo" = nome
    - Enquanto a economia melhora, o desemprego diminui.   # temporal com "enquanto", não "à medida/ao passo que"
    - O tempo passa e ficamos mais velhos.                 # coordenação, sem locução "ao passo que"

# B5.2-67: subordinada adverbial - temporal - no momento em que, na altura em que (+ indicativo)
b5d2_67:
  positive:
    - Fez-se silêncio no momento em que ele subiu ao palco.
    - Estava a chover na altura em que saí de casa.
    - No momento em que a vi, soube que era ela.
    - Na altura em que eles partiram, o sol brilhava.
    - Fechei a porta no momento em que o telefone tocou.
  negative:
    - Naquele momento, todos ficaram em silêncio.          # advérbio de tempo, sem "em que" (sem relativa)
    - Este não é o momento de discutir esse assunto.       # "momento" nome + complemento
    - Na altura, ninguém percebeu o que se passava.        # "na altura" advérbio, sem "em que"
    - O avião está a ganhar altura sobre o oceano.         # "altura" = nome (elevação)
    - Fez-se silêncio quando ele subiu ao palco.           # temporal com "quando", não "no momento em que"

# B5.2-69: subordinada adverbial - concessiva - por muito...que (+ conjuntivo)
b5d2_69:
  positive:
    - Por muito empenhada que seja a Maria, não creio que consiga o emprego.
    - Por muito dinheiro que eles ofereçam, a empresa não está à venda.
    - Por muito rapidamente que a equipa atue, o dano já está feito.
    - Por muitos obstáculos que surjam, manteremos a nossa estratégia intacta.
    - Por muito que chova durante a tarde, o evento realizar-se-á conforme planeado.
  negative:
    - Ele foi elogiado por muito que fez pela instituição. # Causal preposition "por" + pronoun "muito" + relative "que" + indicative.
    - Passámos por muito sofrimento que poderia ter sido facilmente evitado. # Preposition "por" + noun phrase + relative clause + indicative.
    - Por mais esforço que faças, os resultados demoram a aparecer. # Concessive, but uses "mais" instead of the required "muito".
    - Comprei o novo equipamento por muito menos do que o valor de mercado. # Comparative structure, missing subjunctive clause.
    - O projeto de investigação manteve-se suspenso por muito tempo. # Prepositional phrase of time; missing "que" and dependent clause.

# B5.2-70: subordinada adverbial - concessiva - gerundiva
b5d2_70:
  positive:
    - Mesmo não gostando de calor, fui à praia.
    - Ainda estando doente, veio trabalhar.
    - Mesmo sabendo a verdade, não disse nada.
    - Ainda tendo tempo, não quis ajudar.
    - Mesmo sendo pobre, é feliz.
  negative:
    - Sabendo da tua alergia, preparei outro prato.        # gerúndio simples (causal), sem "mesmo/ainda"
    - Ele próprio, ele mesmo, resolveu o problema.         # "mesmo" reforço de pronome
    - Embora não goste de calor, fui à praia.              # concessiva finita com "embora"
    - Mesmo assim, decidi não ir à festa.                  # "mesmo assim" locução, sem gerúndio
    - Chegando a casa, fui logo dormir.                    # gerúndio temporal, sem marcador concessivo

# B5.2-71: subordinada adverbial - concessiva - participial
b5d2_71:
  positive:
    - Embora cansado, trabalhei até de madrugada.
    - Ainda que lesionado, o atleta venceu a corrida.
    - Mesmo irritado, falou com calma.
    - Se bem que ocupado, ele atendeu o telefone.
    - Conquanto triste, ela sorriu para todos.
  negative:
    - Ele foi-se embora sem se despedir de ninguém.        # "embora" na locução "ir(-se) embora"
    - O atleta lesionado desistiu da corrida.              # particípio atributivo (modificador do nome)
    - Embora estivesse cansado, trabalhei até tarde.       # concessiva finita (com verbo), não reduzida
    - Ainda que estivesse triste, ela sorriu.              # concessiva finita, não participial
    - Ele estava ocupado, mas atendeu o telefone.          # coordenação adversativa, sem "embora/ainda que"

# B5.2-73: subordinada adverbial - condicional - se porventura
b5d2_73:
  positive:
    - Teria ajudado o João, se porventura tivesse sabido da sua situação.
    - Iremos visitar-te, se porventura formos a Lisboa.
    - Se porventura chover, ficaremos em casa.
    - Perdoa-me, se porventura te ofendi.
    - Se porventura ele vier, avisa-me.
  negative:
    - Sabes, porventura, a que horas abre a loja?          # "porventura" advérbio em interrogativa (= por acaso)
    - Se chover amanhã, ficaremos em casa.                 # condicional com "se", sem "porventura"
    - Perguntou-me se, porventura, eu conhecia o caminho.  # "porventura" em interrogativa indireta
    - Encontrámos o tesouro por mero acaso.                # "acaso", sem estrutura condicional
    - Caso ele venha, avisa-me.                            # condicional com "caso", sem "se porventura"

# B5.2-74: subordinada adverbial - condicional - salvo se (+ conjuntivo)
b5d2_74:
  positive:
    - O contrato é renovado, salvo se uma das partes decidir de outro modo.
    - Iremos jantar fora, salvo se tu preferires ficar em casa.
    - Sairemos agora, salvo se ainda tiveres trabalho por fazer.
    - Tudo correrá bem, salvo se houver um imprevisto.
    - O teste será amanhã, salvo se o professor o adiar.
  negative:
    - Todos chegaram a casa sãos e salvos.                 # "salvo" adjetivo
    - Vieram todos à reunião, salvo o diretor.             # "salvo" preposição + nome (= exceto)
    - O bombeiro salvou a criança das chamas.              # "salvou" verbo (salvar)
    - Iremos jantar fora se não estiveres cansado.         # condicional com "se", sem "salvo"
    - Sairemos agora, a não ser que chova.                 # condicional com "a não ser que", não "salvo se"

# B5.2-75: subordinada substantiva completiva - de infinitivo (pessoal) - com alteração de ordem
b5d2_75:
  positive:
    - A Paula afirmou ter o João sido o responsável.
    - O diretor pensa terem os funcionários feito um bom trabalho.
    - Julgamos sermos nós os vencedores.
    - Creio teres tu razão.
    - Dizem terem eles encontrado o tesouro.
  negative:
    - A Paula afirmou que o João foi o responsável.
    - O diretor pensa que os funcionários fizeram um bom trabalho.
    - Julgamos que somos nós os vencedores.
    - Creio que tu tens razão.
    - Dizem que eles encontraram o tesouro.

# B5.2-76: subordinada substantiva completiva - de infinitivo (pessoal) - nominalizada, precedida de artigo
b5d2_76:
  positive:
    - O que me surpreendeu foi o ele ter ido sem dizer nada.   # art + subj pron + personal inf
    - O nós estarmos aqui ajuda muito.                          # (fixed from "o facto de...")
    - O eles terem chegado cedo foi uma sorte.                 # inflected inf (3pl)
    - O tu falares assim incomoda-me.          # art + subj pron tu + inflected inf (2sg, overt -es)
    - O nós partirmos agora é essencial.       # art + subj pron nós + inflected inf (1pl, overt -mos)
  negative:
    - O que me surpreendeu foi ele ter ido sem dizer nada.     # minimal pair of P1: personal inf, NO nominalizing article
    - O facto de nós estarmos aqui ajuda muito.                # completiva DO NOME: article heads "facto", inf via "de"
    - O fumar faz mal à saúde.                                 # article + IMPERSONAL inf (no subject, no inflection)
    - É essencial partirmos agora.                             # personal inf, not nominalized (minimal pair of P5)
    - Eles chegaram cedo.                                      # plain finite clause (de-nominalized counterpart of P4)