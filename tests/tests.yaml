# Grammatical structure tests for SABER
# Format:
# matcher_function_name:
#   positive: [list of sentences that should match]
#   negative: [list of sentences that should NOT match]

# A1.1-6: género - masculinos terminados em -ão, e.g. irmão
a1d1_6:
  positive:
    - O meu irmão é alto.
    - Ele comprou um cão.
    - O pão está fresco.
    - O capitão deu a ordem.
    - O balão subiu ao céu.
  negative:
    - O espécime apresentava uma mão com sindactilia congénita.
    - O tribunal deliberou sobre a questão da competência jurisdicional.
    - A ação corretiva mitigou os riscos operacionais identificados.
    - A patologia é endémica nesta região geográfica específica.
    - A estação orbital mantém uma trajetória geossíncrona estável.

# A1.1-7: género - masculinos terminados em -a, e.g. dia, cinema, problema
a1d1_7:
  positive:
    - O dia está bonito.
    - Foi um grande problema.
    - O cinema estava cheio.
    - O sistema falhou.
    - Este tema é interessante.
  negative:
    - A cadeira partiu.
    - Esta é a minha casa.
    - A menina correu.
    - As casas são brancas.
    - O gato é preto.

# A1.1-8: género - nomes invariáveis quanto ao género, e.g. o/a estudante; o/a artista; a criança; a pessoa
a1d1_8:
  positive:
    - O colega de equipa identificou o deadlock no sistema.
    - O especialista em bases de dados otimizou a query.
    - A pessoa responsável pelo projeto de IA foi premiada.
    - O guia do centro de dados explicou a topologia da rede.
    - A estudante terminou o teste.
  negative:
    - O engenheiro de software documentou a API.
    - A programadora corrigiu o bug de interface.
    - O instrutor de formação técnica é certificado.
    - A mestre em linguística computacional lidera o grupo.
    - A menina canta.

# A1.1-9: número - masculinos terminados em -ão, e.g. leão, leões; pão, pães; irmão, irmãos
a1d1_9:
  positive:
    - Os leões são fortes.
    - Os pães estão quentes.
    - Os meus irmãos moram aqui.
    - Os aviões são grandes.
    - Vi dois cães no parque.
  negative:
    - O leão é forte.
    - O pão está quente.
    - O meu irmão mora aqui.
    - As mãos estão sujas.
    - A lição foi difícil.

# A1.1-10: número - nomes invariáveis quanto ao número, e.g. o/os lápis; os óculos; as calças;
a1d1_10:
  positive:
    - O meu lápis partiu.
    - Os meus óculos estão sujos.
    - As calças são azuis.
    - Comprei um lápis novo.
    - Onde estão os meus óculos?
  negative:
    - O carro é novo.
    - A casa é grande.
    - Os livros são pesados.
    - O sapato é preto.
    - A camisa é branca.

# A1.1-11: género - outros casos de flexão - e.g. europeu, europeia; ator, atriz; crocodilo macho; crocodilo fêmea
a1d1_11:
  positive:
    - O ator fez um bom papel.
    - A atriz ganhou o prémio.
    - O crocodilo macho é grande.
    - A baleia fêmea cuida do filhote.
    - Ele é um cidadão europeu.
  negative:
    - O gato é pequeno.
    - A casa é bonita.
    - O professor é simpático.
    - A mesa é redonda.
    - O livro é interessante.

# A1.1-13: número - plural de nomes compostos - e.g. girassóis; navios-escola; porta-vozes; pães-de-ló; amores-perfeitos
a1d1_13:
  positive:
    - Os girassóis cresceram muito.
    - Os navios-escola partiram ontem.
    - Ouvimos os porta-vozes do governo.
    - Comemos pães-de-ló deliciosos.
    - Vi muitos amores-perfeitos no jardim.
  negative:
    - O girassol é amarelo.
    - O navio-escola partiu.
    - O porta-voz falou.
    - O pão-de-ló é doce.
    - O amor-perfeito é bonito.

# A1.1-14: grau - diminutivos e aumentaivos frequentes (-inho, -ito, -zinho, -zito) - e.g.,carrinho/carrito, irmãozinho/irmãozito; carrão, casarão
a1d1_14:
  positive:
    - O carrinho é azul.
    - O meu irmãozinho é engraçado.
    - Que casarão enorme!
    - O cachorrão correu muito.
    - O peixão saltou da água.
  negative:
    - O vinho apresenta uma oxidação prematura.
    - O vizinho detetou uma anomalia estrutural.
    - O apito emitiu um sinal acústico de alta frequência.
    - O coração exibe um ritmo sinusal estável.
    - A cozinha cumpre as normas de segurança alimentar.

# A2.1-4: género - adjetivos invariáveis quanto ao género - e.g., pobre, amável, jovem, simples, feliz
a2d1_4:
  positive:
    - O rapaz é jovem.
    - A rapariga é jovem.
    - Ele é um homem amável.
    - Ela é uma mulher amável.
    - O problema é simples.
  negative:
    - O rapaz é alto.
    - A rapariga é alta.
    - O homem é bom.
    - A mulher é boa.
    - O livro é novo.

# A2.1-5: número - adjetivos invariáveis quanto ao número - e.g., simples, piegas
a2d1_5:
  positive:
    - Estes exercícios são simples.
    - Ele é um rapaz piegas.
    - Eles são uns rapazes piegas.
    - As tarefas são simples.
    - O teste foi simples.
  negative:
    - Estes exercícios são fáceis.
    - Ele é um rapaz alto.
    - Eles são uns rapazes altos.
    - As tarefas são longas.
    - O teste foi difícil.

# A2.1-6: grau - comparativo - e.g., mais alto (do) que; tão alto como / quanto; menos alto (do) que
a2d1_6:
  positive:
    - O relatório é mais detalhado do que o sumário.
    - A nova turbina é menos ruidosa que a anterior.
    - O procedimento é tão seguro como o protocolo padrão.
    - O sucessor foi mais audaz que o predecessor.
    - A amostra B é tão volátil quanto a amostra A.
  negative:
    - A pressão era tão elevada que a válvula cedeu.
    - Quanto mais pressão aplicamos, mais calor é gerado.
    - Este é o mais eficiente dos sistemas testados.
    - A intervenção está mais ou menos programada.
    - Não existem mais dados disponíveis para análise.

# A2.1-7: grau - superlativo relativo - e.g., o mais alto de; o menos alto de
a2d1_7:
  positive:
    - O azoto é o componente mais abundante da atmosfera.
    - Este é o protocolo menos oneroso do projeto.
    - A equipa A foi a mais proficiente do trimestre.
    - O setor primário é o menos resiliente da economia.
    - A fibra ótica é o meio mais eficaz de transmissão.
  negative:
    - O investimento é mais rentável do que a poupança.
    - O investigador recolheu mais provas do fenómeno.
    - A medição deve ser o mais exata possível.
    - O sistema é menos complexo do que se previa.
    - Exigiu-se mais rigor do pessoal técnico.

# A2.1-8: grau - comparativos e superlativos irregulares frequentes - bom, mau, grande, pequeno, alto, baixo; Este livro é bom / melhor (*mais bom) / ótimo.
a2d1_8:
  positive:
    - Este livro é melhor que o outro.
    - A situação está pior agora.
    - Ele é o maior jogador de sempre.
    - A probabilidade de colisão de hashes é menor neste algoritmo.
    - A largura de banda disponível é superior à latência do barramento.
  negative:
    - Este livro é muito bom.
    - A situação está má.
    - Ele é um grande jogador.
    - O meu carro é pequeno.
    - Esta comida está boa.

# A2.1-9: género - feminino de adjetivos compostos - e.g. luso-africano, luso-africana
a2d1_9:
  positive:
    - Ela é uma escritora luso-africana.
    - A relação luso-brasileira é forte.
    - A cultura greco-romana é fascinante.
    - Uma equipa luso-francesa venceu.
    - A aliança anglo-portuguesa é antiga.
  negative:
    - Ele é um escritor luso-africano.
    - O acordo luso-brasileiro foi assinado.
    - O império greco-romano caiu.
    - Um jogador luso-francês marcou.
    - O tratado anglo-português existe.

# A2.1-10: número - plural de adjetivos compostos - verde-claro, verde-claros
a2d1_10:
  positive:
    - Comprei uns olhos verde-claros.
    - Eles são luso-descendentes.
    - As camisas azul-escuras são giras.
    - Foram criados novos centros sócio-culturais.
    - Os conflitos político-sociais continuam.
  negative:
    - Comprei um casaco verde-claro.
    - Ele é luso-descendente.
    - A camisa azul-escura é gira.
    - Foi criado um novo centro sócio-cultural.
    - O conflito político-social terminou.

# A2.1-11: grua - superlativo (-íssimo) - e.g., altíssimo
a2d1_11:
  positive:
    - O parecer técnico é claríssimo quanto aos riscos.
    - A arquitetura do sistema é complexíssima.
    - O procedimento laboratorial é facílimo de executar.
    - O resultado da auditoria foi positivíssimo.
    - A intervenção cirúrgica foi utilíssima para a recuperação.
  negative:
    - O mecanismo de redundância evitou a falha do sistema.
    - O metabolismo celular consome energia química.
    - O vigésimo capítulo aborda a termodinâmica aplicada.
    - O próximo passo é a validação estatística dos dados.
    - O otimismo dos investidores impulsionou o mercado.

# A2.1-12: grau - outros processos - e.g., um rapaz deveras inteligente; uma festa super animada; a casa toda desarrumada
a2d1_12:
  positive:
    - O novo algoritmo é super eficiente.
    - O relatório técnico ficou todo detalhado.
    - A descoberta é imensamente relevante para a área.
    - O clima político está deveras instável.
    - A equipa de investigação ficou extremamente satisfeita.
  negative:
    - O superavit comercial superou as expectativas.
    - Todo o protocolo de segurança foi ignorado.
    - O impacto ambiental da exploração foi imenso.
    - A extremidade do condutor elétrico está isolada.
    - O cientista procedeu conscientemente durante o teste.

# A3.1-11: pretérito perfeito simples do indicativo - forma - verbos regulares [-ar, -er -ir]
a3d1_11:
  positive:
      - Eu participei na conferência internacional.
      - Tu respondeste ao inquérito técnico.
      - O sistema faliu devido a um erro crítico.
      - Nós analisámos os dados estatísticos.
      - Eles decidiram suspender o protocolo.
  negative:
      - Nós analisamos os dados sistematicamente.
      - Os peritos analisarão a estrutura amanhã.
      - O elevado contraste dificulta a leitura.
      - Eles viram a notificação no painel.
      - Se nós decidirmos o plano, avançamos.

# A3.1-12: pretérito perfeito simples do indicativo - forma - verbos irregulares [-ar, -er -ir]
a3d1_12:
  positive:
    - O técnico pôs o sistema em regime de redundância.
    - Eles trouxeram as métricas de desempenho trimestral.
    - A equipa quis implementar um novo algoritmo de compressão.
    - O supervisor soube da falha através do log de eventos.
    - Nós pudemos verificar a integridade estrutural do protótipo.
  negative:
    - O poder de processamento é insuficiente para esta carga.
    - Caso ele fizer a calibração, o erro será mitigado.
    - O trazer de amostras requer um protocolo de biossegurança.
    - Eles virem as notificações é essencial para a operação.
    - O aprendiz de eletrónica estuda o manual de diretrizes.

# A3.1-14: pretérito imperfeito do indicativo - forma - verbos regulares [-ar, -er -ir]
a3d1_14:
  positive:
    - A equipa colaborava no desenvolvimento do protótipo.
    - O sistema emitia alertas de segurança em tempo real.
    - Os investigadores resolviam problemas de lógica complexos.
    - Nós partilhávamos os recursos do servidor central.
    - Tu monitorizavas o fluxo de tráfego na rede.
  negative:
    - A garantia do equipamento expirou no mês passado.
    - O gestor tinha total autonomia sobre o orçamento.
    - O algoritmo operaria melhor sob condições ideais.
    - A bacia hidrográfica apresenta elevados níveis de sedimentação.
    - O software era a solução mais viável para o projeto.
  
# A3.1-15: pretérito imperfeito do indicativo - forma - verbos irregulares
a3d1_15:
  positive:
    - O cenário era favorável à expansão comercial.
    - O reator tinha uma fissura no revestimento primário.
    - Os pacotes de dados vinham encriptados por defeito.
    - O consultor punha em causa a viabilidade do plano.
    - A estrutura mantinha a estabilidade sob carga máxima.
  negative:
    - A linha de montagem interrompeu o ciclo produtivo.
    - A testemunha presenciou o incidente técnico.
    - Ele fizera o diagnóstico antes da falha sistémica.
    - A esfera de influência geopolítica sofreu alterações.
    - O sistema emitia radiação eletromagnética constante.

# A3.1-28: particípio passado - forma - particípios regulares
a3d1_28:
  positive:
    - O engenheiro tinha detetado uma falha na infraestrutura.
    - A administração tinha deferido o requerimento de patente.
    - O sistema tinha emitido um relatório de erro crítico.
    - O técnico tinha substituído os componentes obsoletos.
    - A empresa tinha fornecido os insumos necessários para a obra.
  negative:
    - O resultado da análise laboratorial foi inconclusivo.
    - O agente líquido estabilizou a reação exotérmica.
    - O marido da investigadora assinou o termo de responsabilidade.
    - O conselho tinha aberto um inquérito de natureza disciplinar.
    - O paciente apresentava um quadro clínico pálido e letárgico.

# A3.1-29: particípio passado - forma - particípios irregulares (frequentes)
a3d1_29:
  positive:
    - O script de automação tinha escrito os resultados no log de auditoria.
    - O tribunal tinha aceite o recurso apresentado pela defesa.
    - O administrador de sistemas tinha aberto a porta 8080 no firewall.
    - O arquiteto de software tinha dito que a API seria retrocompatível.
    - O auditor de segurança tinha visto a vulnerabilidade no código-fonte.
  negative:
    - O gestor de projeto tinha concluído o planeamento da migração.
    - A equipa de QA tinha instalado o ambiente de testes na cloud.
    - O servidor de base de dados tinha processado todos os pedidos pendentes.
    - O sistema operativo tinha executado a rotina de limpeza de memória.
    - O departamento de TI tinha publicado a nova política de segurança.

# A3.1-31: particípio passado - forma - auxiliar ter no imperfeito do indicativo + particípio passado do verbo principal
a3d1_31:
  positive:
    - O algoritmo tinha processado o volume total de dados.
    - A equipa de engenharia tinha resolvido a vulnerabilidade.
    - Nós tínhamos obtido os resultados antes da conferência.
    - O tribunal tinha proferido a sentença na semana anterior.
    - O software tinha assumido o controlo de forma automática.
  negative:
    - O microscópio eletrónico tinha a lente embaciada.
    - O diagnóstico clínico revelou um caso de tinha capitis.
    - O gestor tinha o orçamento limitado para este projeto.
    - O técnico tinha o cuidado de verificar as ligações.
    - O dispositivo tinha o certificado de calibração válido.

# A3.1-34: pretérito perfeito composto do indicativo - forma - auxiliar ter no presente do indicativo + particípio passado do verbo principal
a3d1_34:
  positive:
    - O laboratório tem monitorizado a atividade sísmica continuamente.
    - As autoridades têm implementado novas medidas de cibersegurança.
    - Temos verificado uma oscilação térmica nos condutores.
    - Tens analisado o impacto ambiental desta exploração?
    - A administração tem proferido decisões favoráveis ao projeto.
  negative:
    - As têmporas do paciente apresentam sinais de inflamação.
    - O gestor tem o relatório concluído na sua secretária.
    - O dispositivo teme a exposição prolongada a radiação UV.
    - Temos o dever de reportar qualquer anomalia sistémica.
    - Tens o nível de tensão regulado de acordo com a norma?

# A3.1-36: infinitivo pessoal simples - forma - [-ar, -er -ir]
a3d1_36:
  positive:
    - É essencial concluírem a calibração antes do ensaio.
    - Para acederes ao servidor central, necessitas de autorização.
    - Ao transferirmos os ficheiros, detetámos uma latência na rede.
    - Sem compreenderdes a arquitetura, não podereis otimizar o código.
    - O facto de eles intervirem no processo mitigou os riscos.
  negative:
    - Se eles trouxerem o protótipo, faremos a demonstração técnica.
    - O regime de tributação varia conforme o setor de atividade.
    - Os sensores medem a pressão atmosférica em Pascal.
    - Esta paragem inesperada comprometeu o fluxo de produção.
    - Nós verificamos a estanqueidade da válvula sistematicamente.

# A3.1-38: futuro simples do indicativo - forma - verbos regulares [-ar, -er -ir]
a3d1_38:
  positive:
    - O consultor analisará o impacto financeiro da medida.
    - As variáveis dependerão da estabilidade do mercado cambial.
    - Nós concluiremos a auditoria no final do semestre.
    - Tu imprimirás os relatórios para a reunião de direção.
    - A equipa verificará a conformidade dos novos protocolos.
  negative:
    - Eles analisaram as métricas durante a sessão anterior.
    - O alvará de licenciamento aguarda homologação superior.
    - Os peritos dirão a verdade durante o depoimento oficial.
    - O acórdão do Supremo Tribunal foi publicado hoje.
    - Para eles decidirem, é necessário consultar o regulamento.

# A3.1-39: futuro simples do indicativo - forma - verbos irregulares
a3d1_39:
  positive:
    - O perito refará o cálculo da resistência de materiais.
    - Estes dados trarão maior precisão ao modelo preditivo.
    - Eu contradirei as evidências apresentadas no relatório.
    - Nós faremos a manutenção preventiva dos servidores.
    - Tu dirás se o sistema cumpre os requisitos de segurança.
  negative:
    - Se o técnico fizer a calibração, o erro será eliminado.
    - O alvará de habitabilidade foi deferido pela autarquia.
    - A nova lei obrigará a uma revisão do contrato de trabalho.
    - O acórdão do tribunal foi favorável à pretensão da empresa.
    - É importante trazer os documentos para a reunião de hoje.

# A3.1-42: condicional simples - forma - verbos regulares [-ar, -er -ir]
a3d1_42:
  positive:
    - O dispositivo operaria em condições extremas com o isolamento adequado.
    - Estes protocolos assegurariam a proteção contra ataques de negação de serviço.
    - Nós procederíamos à substituição dos componentes em caso de avaria.
    - Tu monitorizarias o consumo energético se o sensor estivesse ativo.
    - A nova diretriz permitiria uma redução dos custos operacionais.
  negative:
    - O perito traria o relatório se a análise estivesse concluída.
    - A engenharia de software exige um domínio de padrões de desenho.
    - O sistema admitia a existência de redundâncias na base de dados.
    - Todavia, os resultados não confirmam a hipótese inicial.
    - A garantia do fabricante cobre defeitos de fabrico por dois anos.

# A3.1-43: condicional simples - forma - verbos irregulares
a3d1_43:
  positive:
    - O novo software refaria o processamento em caso de interrupção.
    - Estes sensores trariam maior precisão à monitorização remota.
    - Nós satisfaríamos a procura se a linha de montagem estivesse ativa.
    - O consultor diria a verdade sobre o passivo da empresa.
    - Tu farias a calibração se tivesses o equipamento necessário.
  negative:
    - A maquinaria pesada requer uma inspeção técnica trimestral.
    - O engenheiro partiria o componente se aplicasse força excessiva.
    - O técnico fazia a manutenção quando detetou a anomalia.
    - A biometria assegura a integridade do controlo de acessos.
    - Se o perito fizer a perícia, o relatório será conclusivo.

# A3.1-46: presente do conjuntivo - forma - verbos regulares [-ar, -er -ir]
a3d1_46:
  positive:
    - É provável que o sistema analise os pacotes de dados.
    - É fundamental que tu cumpras o regulamento interno.
    - Embora nós discutamos o orçamento, a decisão é da administração.
    - Caso eles recolham as evidências, o processo avançará.
    - Desejo que vós concluais o relatório técnico amanhã.
  negative:
    - A análise laboratorial revelou uma contaminação bacteriana.
    - Nós verificamos a estanqueidade dos circuitos diariamente.
    - É necessário que o diretor tenha acesso às credenciais.
    - A margem de erro estatístico é de dois pontos percentuais.
    - O debate sobre a inteligência artificial é de cariz ético.

# A3.1-47: presente do conjuntivo - forma - alternância vocálica na 1.ª pessoa de alguns verbos
a3d1_47:
  positive:
    - É recomendável que o sistema prefira o protocolo de encriptação mais robusto.
    - Duvido que a estrutura sinta o impacto da vibração mecânica.
    - É necessário que a aplicação peça autorização ao administrador.
    - Caso o sensor repita a leitura errática, deve ser substituído.
    - Espero que este modelo de simulação sirva para o teste de carga.
  negative:
    - Eu prefiro analisar os dados brutos antes de emitir o parecer.
    - A cinta de segurança deve estar devidamente ajustada ao operador.
    - A peça sobresselente foi instalada no compartimento do motor.
    - A vista explodida do componente facilita a montagem do protótipo.
    - É provável que o técnico insista na revisão dos parâmetros.

# A3.1-48: presente do conjuntivo - forma - verbos irregulares [-ar, -er -ir] não formados a partir da 1.ª pessoa sing. do presente do indicativo
a3d1_48:
  positive:
    - É imperativo que a solução seja escalável horizontalmente.
    - É necessário que o operador saiba interpretar a telemetria.
    - Embora haja redundância, a monitorização deve ser constante.
    - Caso o fluxo de dados vá para o servidor secundário, a latência subirá.
    - É improvável que a equipa esteja disponível para a migração hoje.
  negative:
    - O ser humano apresenta limitações em ambientes de alta pressão.
    - O engenheiro faça o que fizer, o erro de sistema persiste.
    - O consultor age em conformidade com as normas ISO vigentes.
    - A vaga de calor comprometeu o arrefecimento do centro de dados.
    - O valor de pH da amostra deve ser medido com precisão.

# A3.1-57: particípio passado - forma - forma irregular de particípio (particípios duplos), com variação em género e número
a3d1_57:
  positive:
    - O protocolo de segurança foi aceite pela administração.
