# B5.2-6: subordinada adverbial - causal - porque (+ indicativo)
b5d2_6:
  positive:
    - Gosto de Portugal, porque é um país bonito.
    - Ele não veio, porque estava doente.
    - Vou sair agora, porque tenho pressa.
    - Nós estudamos muito, porque queremos passar.
    - Elas gritaram, porque tiveram medo.
  negative:
    - Porque é que não vieste à aula ontem?                # "porque" interrogativo (pergunta), não causal
    - Ninguém sabe o porquê da sua decisão.                # "porquê" nome
    - Gosto de Portugal por causa do clima ameno.          # causa por locução prepositiva + nome
    - Estas são as razões por que não fui à festa.         # "por que" relativo
    - Vou sair agora para chegar a tempo.                  # oração final, não causal

