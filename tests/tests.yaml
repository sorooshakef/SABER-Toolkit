    - Eu leio sempre.
    - Ela estuda muito.
    - Eles falam alto.
    - Nós cantamos bem.

# B5.2-15: subordinada adverbial - temporal - desde que (+ indicativo)
b5d2_15:
  positive:
    - Desde que cheguei, ainda não vi o Pedro.
    - Ela está feliz desde que começou o curso.
    - Desde que ele partiu, a casa está vazia.
    - Não comi nada desde que acordei.
    - Eles moram aqui desde que se casaram.
  negative:
    - Podes usar o carro, desde que o devolvas amanhã.     # "desde que" + conjuntivo = condicional, não temporal
    - Não o vejo desde a semana passada.                   # "desde" + nome (locução prepositiva)
    - Ele está aqui desde as oito da manhã.                # "desde" + nome
    - Faremos o trabalho, desde que todos ajudem.          # "desde que" condicional (+ conjuntivo)
    - Cheguei há duas horas e ainda não vi o Pedro.        # temporal com "há", sem "desde que"

# B5.2-16: subordinada adverbial - causal - como (+ indicativo)
b5d2_16:
  positive:
