[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saber-pt"
version = "0.1.0"
description = "Identify European Portuguese grammatical structures and extract CEFR-linked features from text"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Soroosh Akef", email = "s.akef@iwm-tuebingen.de" }]
keywords = [
    "portuguese",
    "cefr",
    "nlp",
    "grammatical structures",
    "second language acquisition",
    "readability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "spacy==3.8.7",
    "spacy_stanza==1.0.4",
    "Unidecode==1.3.8",
    # Declared explicitly although nothing here imports it: spaCy's top-level
    # __init__ imports its CLI, so `import spacy` needs click (via typer). It
    # arrives transitively in a clean install, but goes missing in mixed
    # conda/pip environments, and the resulting ImportError looks like a SABER
    # bug. Requiring it directly makes pip repair such an environment.
    "click>=8.0",
    # Pinned: Stanza model loading breaks with newer torch releases.
    "torch==2.5.1",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/Sarvash/SABER-Toolkit"
Issues = "https://github.com/Sarvash/SABER-Toolkit/issues"

# saber.matchers has no __init__.py on purpose -- the folder is replaced
# wholesale whenever the matchers are updated upstream, so it must not depend on
# a file this project adds. It is listed explicitly so packaging picks it up.
[tool.setuptools]
packages = ["saber", "saber.matchers"]
